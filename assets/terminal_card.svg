<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="auto" fill="none">
  <defs>
    <style>
      .terminal-text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; font-size: 13px; fill: #c9d1d9; }
      .prompt-cyan { fill: #58a6ff; font-weight: bold; }
      .prompt-green { fill: #3fb950; font-weight: bold; }
      .val-white { fill: #f0f6fc; }
      .val-purple { fill: #bc8cff; }
      .val-muted { fill: #6e7681; }
      .cursor {
        animation: blink 1s infinite step-start;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="300" rx="10" fill="#090d13" stroke="url(#termBorder)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="850" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="850" height="10" fill="#161b22"/>
  <line x1="0" y1="36" x2="850" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="425" y="23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e" letter-spacing="1">egor@workstation: ~/portfolio (zsh)</text>
  <text x="825" y="23" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3fb950">● ONLINE</text>

  <!-- Terminal Content Lines -->
  <g class="terminal-text" transform="translate(24, 62)">
    <!-- Command Execution -->
    <text y="0"><tspan class="prompt-green">➜</tspan> <tspan class="prompt-cyan">egorfm</tspan> <tspan class="val-muted">git:(</tspan><tspan fill="#d29922">main</tspan><tspan class="val-muted">)</tspan> <tspan class="val-white">fastfetch --profile developer</tspan></text>

    <!-- Divider -->
    <line x1="0" y1="12" x2="802" y2="12" stroke="#21262d" stroke-dasharray="3,3"/>

    <!-- Key-Value Output -->
    <g transform="translate(10, 36)">
      <text y="0"><tspan class="val-purple">Identity</tspan>     <tspan class="val-muted">·····</tspan> <tspan class="val-white">Egor Fominykh</tspan> <tspan class="val-muted">(Backend Developer &amp; AI Automation Engineer)</tspan></text>
      <text y="24"><tspan class="val-purple">Company</tspan>      <tspan class="val-muted">·····</tspan> <tspan class="val-white">CDEK</tspan> <tspan class="val-muted">— Scaling 500+ Scraping Pipelines &amp; AI Workflows</tspan></text>
      <text y="48"><tspan class="val-purple">Core Stack</tspan>   <tspan class="val-muted">·····</tspan> <tspan class="val-white">Python, PostgreSQL, Redis, Docker, Playwright, Git</tspan></text>
      <text y="72"><tspan class="val-purple">AI / Agents</tspan>  <tspan class="val-muted">·····</tspan> <tspan class="val-white">LangChain, Langflow, n8n, LLM APIs, RAG, Prompt Eng</tspan></text>
      <text y="96"><tspan class="val-purple">Architecture</tspan> <tspan class="val-muted">·····</tspan> <tspan class="val-white">High-Throughput Crawlers, Event-Driven ETL, Robust APIs</tspan></text>
      <text y="120"><tspan class="val-purple">Motto</tspan>        <tspan class="val-muted">·····</tspan> <tspan fill="#79c0ff">"Building resilient systems where data meets intelligence."</tspan></text>
    </g>

    <!-- Next prompt with blinking cursor -->
    <text y="196"><tspan class="prompt-green">➜</tspan> <tspan class="prompt-cyan">egorfm</tspan> <tspan class="val-muted">git:(</tspan><tspan fill="#d29922">main</tspan><tspan class="val-muted">)</tspan> <tspan class="val-white">python3 -m cdek.run_pipeline</tspan><tspan class="cursor" fill="#58a6ff"> █</tspan></text>
  </g>
</svg>